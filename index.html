<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Modifier un PKPass</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
    label { font-weight: bold; display: block; margin-top: 10px; }
    input, button { padding: 10px; font-size: 1em; width: 100%; margin-top: 5px; }
    .field { margin-bottom: 15px; }
  </style>
</head>
<body>
  <h2>Éditeur .pkpass (auto-form)</h2>
  <input type="file" id="fileInput" accept=".pkpass" />
  <div id="formContainer"></div>
  <button onclick="savePkpass()">Télécharger le PKPass modifié</button>

  <script>
    let zipInstance;
    let originalFiles = {};
    let passJson = {};

    document.getElementById('fileInput').addEventListener('change', async function () {
      const file = this.files[0];
      if (!file || !file.name.endsWith(".pkpass")) {
        alert("Veuillez sélectionner un fichier .pkpass.");
        return;
      }

      const arrayBuffer = await file.arrayBuffer();
      zipInstance = await JSZip.loadAsync(arrayBuffer);

      originalFiles = {};
      zipInstance.forEach((relativePath, file) => {
        originalFiles[relativePath] = file;
      });

      if (!originalFiles['pass.json']) {
        alert("Ce fichier .pkpass ne contient pas de pass.json !");
        return;
      }

      const jsonContent = await originalFiles['pass.json'].async("string");
      passJson = JSON.parse(jsonContent);
      afficherFormulaire(passJson);
    });

    function afficherFormulaire(json) {
      const container = document.getElementById("formContainer");
      container.innerHTML = "";

      const champs = [
        { key: "logoText", label: "Texte du logo" },
        { key: "description", label: "Description" },
        { key: "organizationName", label: "Organisation" }
      ];

      champs.forEach(field => {
        if (json[field.key] !== undefined) {
          container.innerHTML += `
            <div class="field">
              <label>${field.label}</label>
              <input type="text" id="${field.key}" value="${json[field.key]}">
            </div>`;
        }
      });

      // Gérer les primaryFields s’ils existent
      if (json.generic?.primaryFields?.length) {
        json.generic.primaryFields.forEach((item, index) => {
          const fieldId = `primaryField_${index}`;
          container.innerHTML += `
            <div class="field">
              <label>${item.label || item.key}</label>
              <input type="text" id="${fieldId}" value="${item.value}">
            </div>`;
        });
      }
    }

    async function savePkpass() {
      if (!zipInstance || !originalFiles['pass.json']) {
        alert("Aucun pass chargé !");
        return;
      }

      // Maj des champs de base
      ["logoText", "description", "organizationName"].forEach(key => {
        const input = document.getElementById(key);
        if (input) passJson[key] = input.value;
      });

      // Maj des primaryFields
      if (passJson.generic?.primaryFields?.length) {
        passJson.generic.primaryFields.forEach((item, index) => {
          const input = document.getElementById(`primaryField_${index}`);
          if (input) item.value = input.value;
        });
      }

      const newZip = new JSZip();
      for (let path in originalFiles) {
        if (path === "pass.json") continue;
        const data = await originalFiles[path].async("uint8array");
        newZip.file(path, data);
      }

      newZip.file("pass.json", JSON.stringify(passJson, null, 2));

      newZip.generateAsync({ type: "blob" }).then(content => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = "modifié.pkpass";
        a.click();
      });
    }
  </script>
</body>
</html>
