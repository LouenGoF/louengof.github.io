<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Éditeur de PKPass (100% Frontend)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f3f4f6;
      padding: 2rem;
      max-width: 700px;
      margin: auto;
    }
    h2 {
      margin-top: 1.5rem;
    }
    input[type="file"] {
      margin-bottom: 1rem;
    }
    .field {
      margin-bottom: 1rem;
    }
    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 0.3rem;
    }
    .field input {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 0.7rem 1.2rem;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #005fd1;
    }
    #form-area {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

  <h1>🧾 Éditeur de PKPass (100% Frontend)</h1>
  <p>Charge un fichier `.pkpass`, modifie les champs, puis télécharge ta version personnalisée sans aucun serveur.</p>

  <input type="file" id="fileInput" accept=".pkpass" />
  <div id="form-area"></div>
  <button id="downloadBtn" style="display:none">📦 Télécharger le nouveau PKPass</button>

  <script>
    let zip, originalZipContent = {};
    let passJson = {};
    
    document.getElementById("fileInput").addEventListener("change", async function (e) {
      const file = e.target.files[0];
      if (!file || !file.name.endsWith(".pkpass")) {
        alert("Fichier invalide. Choisis un fichier .pkpass");
        return;
      }

      zip = await JSZip.loadAsync(file);
      if (!zip.files["pass.json"]) {
        alert("Ce fichier ne contient pas de pass.json");
        return;
      }

      // Stocker tous les fichiers d’origine
      for (const filename in zip.files) {
        if (filename !== "pass.json") {
          originalZipContent[filename] = await zip.files[filename].async("uint8array");
        }
      }

      const jsonText = await zip.files["pass.json"].async("string");
      passJson = JSON.parse(jsonText);
      buildForm(passJson);
    });

    function buildForm(data) {
      const formArea = document.getElementById("form-area");
      formArea.innerHTML = '<h2>✏️ Modifier le contenu</h2>';
      for (const key in data) {
        if (typeof data[key] === "string") {
          const field = document.createElement("div");
          field.className = "field";
          field.innerHTML = `
            <label for="${key}">${key}</label>
            <input type="text" name="${key}" id="${key}" value="${data[key]}" />
          `;
          formArea.appendChild(field);
        }
      }
      document.getElementById("downloadBtn").style.display = "inline-block";
    }

    document.getElementById("downloadBtn").addEventListener("click", async () => {
      // Mettre à jour pass.json avec les champs modifiés
      for (const key in passJson) {
        const input = document.getElementById(key);
        if (input) passJson[key] = input.value;
      }

      const newZip = new JSZip();
      newZip.file("pass.json", JSON.stringify(passJson, null, 2));

      for (const filename in originalZipContent) {
        newZip.file(filename, originalZipContent[filename]);
      }

      const blob = await newZip.generateAsync({ type: "blob" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "pkpass_modifié.pkpass";
      link.click();
    });
  </script>
</body>
</html>
