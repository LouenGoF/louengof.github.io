<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Pass Designer - Générez votre Pass</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --primary: #007aff;
      --bg: #f6f8fc;
      --card: #ffffff;
      --text: #1f2937;
      --accent: #f1f5f9;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    .brand {
      text-align: center;
      padding: 2rem 1rem 1rem;
    }

    .brand h1 {
      font-size: 2rem;
      margin-bottom: 0.2rem;
      color: var(--primary);
    }

    .brand p {
      font-size: 1rem;
      color: #555;
    }

    .form-container {
      background: var(--card);
      max-width: 480px;
      margin: 2rem auto;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .form-group {
      margin-bottom: 1.4rem;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.8rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: var(--accent);
    }

    .cta-button {
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .cta-button:hover {
      background: #005fd1;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.9rem;
      color: #999;
    }

    @media (max-width: 500px) {
      .form-container {
        margin: 1rem;
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- 💎 Branding -->
  <header class="brand">
    <h1>Pass Designer</h1>
    <p>Générez votre carte PKPass personnalisée en quelques secondes</p>
  </header>

  <!-- 🧾 Formulaire -->
  <form class="form-container" action="#" method="POST">
    <!-- 🎯 Champ Nom -->
    <div class="form-group">
      <label for="nom">Nom complet</label>
      <input type="text" id="nom" name="nom" value="Jean Dupont" />
    </div>

    <!-- 🎯 Champ Email -->
    <div class="form-group">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" name="email" value="jean@example.com" />
    </div>

    <!-- 🎯 Champ Événement -->
    <div class="form-group">
      <label for="event">Événement</label>
      <input type="text" id="event" name="event" value="Concert Live 2025" />
    </div>

    <!-- 🎯 Champ Date -->
    <div class="form-group">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" value="2025-06-15" />
    </div>

    <!-- 🎯 Champ Lieu -->
    <div class="form-group">
      <label for="lieu">Lieu</label>
      <input type="text" id="lieu" name="lieu" value="Stade de France" />
    </div>

    <!-- CTA -->
    <button class="cta-button" type="submit">🎟 Générer mon PKPass</button>
  </form>

  <footer>
    © 2025 Pass Designer. Tous droits réservés.
  </footer>

</body>
</html>
